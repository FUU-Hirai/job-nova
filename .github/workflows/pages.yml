name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 本番（リポジトリ変数 SITE_ENV=production）のときだけ noindex を外す。それ以外は検索エンジンに載せない
      - name: Allow indexing in production
        if: vars.SITE_ENV == 'production'
        run: |
          sed -i '/<meta name="robots" content="noindex">/d' public/index.html
          ! grep -q 'name="robots"' public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
